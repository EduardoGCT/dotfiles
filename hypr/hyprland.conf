################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor=DP-1,1920x1080@179.96,0x0,1
monitor=HDMI-A-1,1920x1080@60.00,1920x0,1


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun
$navegador = brave


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
exec-once = waybar & hyprpaper
exec-once = awww-daemon & sleep 1 && awww img /home/gambs/Wallpapers/treem.jpg
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

exec-once = kbuildsycoca6

exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data
exec-once = org.corectrl.CoreCtrl --minimize-systray  

exec-once = mako

